<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>내 훈련 현황 - albafit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Pretendard',-apple-system,sans-serif; color:#14171C; }
.mono { font-family:'IBM Plex Mono',monospace; }
.page-bg {
  min-height:100vh;
  background:
    radial-gradient(700px 500px at 15% -10%, rgba(61,111,224,0.10), transparent 60%),
    radial-gradient(600px 500px at 90% 5%, rgba(127,166,255,0.10), transparent 55%),
    radial-gradient(900px 700px at 50% 120%, rgba(61,111,224,0.06), transparent 60%),
    #F4F5F7;
}
.glass { background:rgba(255,255,255,0.66); border:1px solid rgba(20,23,28,0.07); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-radius:20px; }
.nav { display:flex; align-items:center; justify-content:space-between; padding:22px 8%; }
.logo { display:flex; align-items:center; gap:9px; }
.logo-mark { width:28px; height:28px; border-radius:8px; background:linear-gradient(135deg,#3D6FE0,#7FA6FF); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; color:#fff; }
.logo-word { font-size:16px; font-weight:800; letter-spacing:-0.01em; }
.me-badge { display:flex; align-items:center; gap:8px; font-size:13px; color:#5B616C; }
.me-avatar { width:28px; height:28px; border-radius:50%; background:rgba(61,111,224,0.12); color:#2856C4; font-weight:700; font-size:11px; display:flex; align-items:center; justify-content:center; }

.wrap { max-width:640px; margin:0 auto; padding:8px 8% 100px; }

.hero-card { padding:28px; display:flex; align-items:center; gap:20px; margin-bottom:20px; }
.hero-card img { width:64px; height:64px; object-fit:cover; object-position:50% 10%; border-radius:50%; flex-shrink:0; }
.hero-text .eyebrow { font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#3D6FE0; margin-bottom:6px; }
.hero-text h1 { font-size:19px; font-weight:800; margin-bottom:4px; }
.hero-text p { font-size:13px; color:#5B616C; }

.stat-row { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px; }
.stat { padding:16px 18px; text-align:center; }
.stat b { display:block; font-size:20px; font-weight:800; }
.stat span { font-size:11.5px; color:#8A93A0; }

.section-label { font-size:14.5px; font-weight:700; margin-bottom:14px; }

.category-panel { padding:20px 22px; margin-bottom:20px; }
.cat-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid rgba(20,23,28,0.06); }
.cat-row:first-of-type { border-top:none; }
.cat-name { font-size:13.5px; width:120px; flex-shrink:0; }
.cat-bar-track { flex:1; height:8px; border-radius:99px; background:rgba(20,23,28,0.07); overflow:hidden; }
.cat-bar-fill { height:100%; background:linear-gradient(90deg,#3D6FE0,#7FA6FF); }
.cat-score { font-size:12.5px; font-weight:700; width:34px; text-align:right; flex-shrink:0; }

.history-panel { padding:20px 22px; margin-bottom:24px; }
.history-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid rgba(20,23,28,0.06); font-size:13px; }
.history-row:first-of-type { border-top:none; }
.history-date { color:#8A93A0; width:80px; flex-shrink:0; font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.history-scenario { flex:1; color:#33363C; }
.history-score { font-weight:700; }

.cta-row { display:flex; gap:10px; }
.btn-ghost { background:rgba(255,255,255,0.7); color:#14171C; font-weight:600; font-size:14px; padding:13px 22px; border-radius:10px; border:1px solid rgba(20,23,28,0.12); cursor:pointer; flex:1; }
.btn-primary { background:#3D6FE0; color:#fff; font-weight:700; font-size:14px; padding:13px 22px; border-radius:10px; border:none; cursor:pointer; flex:1.4; }
</style>
</head>
<body>
<div class="page-bg">
  <div class="nav">
    <div class="logo"><div class="logo-mark">A</div><span class="logo-word">albafit</span></div>
    <div class="me-badge"><div class="me-avatar">이서</div>이서준님</div>
  </div>

  <div class="wrap">
    <div class="hero-card glass">
      <img src="../../img/mascot-approve.png" alt="">
      <div class="hero-text">
        <div class="eyebrow">나의 훈련 현황</div>
        <h1>이서준님, 잘하고 계세요</h1>
        <p>카페 · 디저트 기준 8개 상황 모두 완료했어요</p>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat glass"><b>94점</b><span>최근 점수</span></div>
      <div class="stat glass"><b>8/8</b><span>완료한 상황</span></div>
      <div class="stat glass"><b>+6점</b><span>지난 훈련 대비</span></div>
    </div>

    <div class="section-label">항목별 나의 점수</div>
    <div class="category-panel glass">
      <div class="cat-row">
        <span class="cat-name">인사말</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:98%"></div></div>
        <span class="cat-score">98점</span>
      </div>
      <div class="cat-row">
        <span class="cat-name">커스텀 음료 요청</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:95%"></div></div>
        <span class="cat-score">95점</span>
      </div>
      <div class="cat-row">
        <span class="cat-name">포장 · 매장 확인</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:92%"></div></div>
        <span class="cat-score">92점</span>
      </div>
      <div class="cat-row">
        <span class="cat-name">컴플레인 대응</span>
        <div class="cat-bar-track"><div class="cat-bar-fill" style="width:78%"></div></div>
        <span class="cat-score">78점</span>
      </div>
    </div>

    <div class="section-label">최근 훈련 기록</div>
    <div class="history-panel glass">
      <div class="history-row">
        <span class="history-date">07.09</span>
        <span class="history-scenario">환불 요청 상황</span>
        <span class="history-score">94점</span>
      </div>
      <div class="history-row">
        <span class="history-date">07.07</span>
        <span class="history-scenario">커스텀 음료 상황</span>
        <span class="history-score">88점</span>
      </div>
      <div class="history-row">
        <span class="history-date">07.05</span>
        <span class="history-scenario">첫 인사 상황</span>
        <span class="history-score">85점</span>
      </div>
    </div>

    <div class="cta-row">
      <a class="btn-ghost" href="feedback_report.html" style="display:inline-block; text-decoration:none; text-align:center;">전체 리포트 보기</a>
      <a class="btn-primary" href="training_session.html" style="display:inline-block; text-decoration:none; text-align:center;">컴플레인 대응 다시 훈련하기 →</a>
    </div>
  </div>
</div>
</body>
</html>
